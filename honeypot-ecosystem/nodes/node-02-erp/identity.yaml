# node-02: the ERP portal an attacker reaches by pivoting from jump-01.
#
# Everything structural is inherited from shared/node-build. Only what makes
# this host *this host* lives here.

host:
  name: erp-web
  domain: cs.internal
  kind: web
  role: Student ERP portal (staging)
  os_release: "22.04.4 LTS (Jammy Jellyfish)"
  os_version_id: "22.04"
  kernel: "5.15.0-118-generic"
  arch: x86_64

history:
  # Deliberately not the same as jump-01. Two hosts in an estate with
  # byte-identical uptime and login history were provisioned together by a
  # script, and an attacker who compares them can see that.
  days: 131
  timezone: Asia/Kolkata
  workday_start: 9
  workday_end: 19

users:
  # `deploy` is the account the stolen key authorises. It must exist here and
  # nowhere else, or the pivot lands on a host that was expecting it.
  - name: deploy
    uid: 1000
    gecos: "ERP deployment"
    login: true
    password: "Deploy@2026"
    sudo: false
    shell: /bin/bash
    profile: service
    home_mode: "0755"

  # erpadmin owns the application; deploy is in its group so the deploy
  # account can read the config it is responsible for deploying.
  - name: erpadmin
    uid: 1001
    gecos: "ERP application owner"
    login: false
    sudo: true
    shell: /bin/bash
    profile: developer

  - name: ta_miller
    uid: 1002
    gecos: "S. Miller (TA)"
    login: false
    sudo: false
    shell: /bin/bash
    profile: teaching_assistant

known_hosts: []

services:
  - name: nginx
    unit: nginx.service
    port: 80
  - name: gunicorn
    unit: erp-portal.service
    port: 8080
  - name: ssh
    unit: ssh.service
    port: 22

# Ambient activity: the cron jobs that keep this box doing something while
# somebody is watching it. Everything else in this file is history, true when
# the image was built and frozen after it; these are what an attacker sees
# change if they tail a log or run the same command twice ten minutes apart.
#
# The schedule is written in structured fields rather than a cron expression
# because the same fields generate the crontab line AND the seeded history --
# a fixed-interval job whose log has irregular gaps before this boot and
# regular ones after it is a sharper tell than no monitoring at all.
#
# Job names come from AMBIENT_JOBS in shared/node-build/ambient.py; asking for
# one that does not exist fails the build.
ambient:
  - job: disk-report
    every_minutes: 20
    hours: "8-20"
  # Worth more than the line it writes: the probe goes through nginx, so the
  # access log an attacker greps first keeps growing on its own.
  - job: portal-healthcheck
    every_minutes: 5
