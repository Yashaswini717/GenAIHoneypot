# node-03: the records database. The terminus of the pivot chain, and the
# thing the whole estate exists to appear to protect.

host:
  name: db-01
  domain: cs.internal
  kind: db
  role: Student records database
  os_release: "22.04.4 LTS (Jammy Jellyfish)"
  os_version_id: "22.04"
  kernel: "5.15.0-118-generic"
  arch: x86_64

history:
  days: 168
  timezone: Asia/Kolkata
  workday_start: 9
  workday_end: 19

users:
  - name: dbadmin
    uid: 1000
    gecos: "Database administrator"
    login: true
    password: "Db@dmin2026"
    sudo: true
    shell: /bin/bash
    profile: developer
    home_mode: "0755"

  - name: erpsync
    uid: 1001
    gecos: "ERP replication account"
    login: false
    sudo: false
    shell: /usr/sbin/nologin
    profile: service

known_hosts: []

services:
  - name: mysql
    unit: mariadb.service
    port: 3306
  - name: ssh
    unit: ssh.service
    port: 22

# Ambient activity: the cron jobs that keep this box doing something while
# somebody is watching it. Everything else in this file is history, true when
# the image was built and frozen after it; these are what an attacker sees
# change if they tail a log or run the same command twice ten minutes apart.
#
# The schedule is written in structured fields rather than a cron expression
# because the same fields generate the crontab line AND the seeded history --
# a fixed-interval job whose log has irregular gaps before this boot and
# regular ones after it is a sharper tell than no monitoring at all.
#
# Job names come from AMBIENT_JOBS in shared/node-build/ambient.py; asking for
# one that does not exist fails the build.
ambient:
  - job: disk-report
    every_minutes: 20
    hours: "8-20"
  # 02:15, just before the ERP sync at 02:17 that reads from it. Leaves real
  # gzipped dumps in /var/backups/mysql that an attacker can gunzip and read.
  - job: db-backup
    at: "02:15"
